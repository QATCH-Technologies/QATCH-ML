[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qatch-ml"
version = "0.1.0"
description = "QATCH sensor-run POI detection pipeline: dataset building, training, DP-based decode, live inference, and QA (the qmodel_7_onyx system)."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "opencv-python",
    "matplotlib",
    "scipy",
    "ultralytics",
    "tqdm",
    "loguru",
]

[project.optional-dependencies]
tier-discovery = ["scikit-learn"]
dev = ["pytest", "pytest-cov", "ruff", "build"]

[project.scripts]
qmodel-build-detectors = "src.systems.qmodel_7_onyx.dataset.build_detectors:main"
qmodel-build-fill-dataset = "src.systems.qmodel_7_onyx.dataset.build_fill_classifier:main"
qmodel-train-detectors = "src.systems.qmodel_7_onyx.training.train_detectors:main"
qmodel-train-fill-classifier = "src.systems.qmodel_7_onyx.training.train_fill_classifier:main"
qmodel-benchmark = "src.systems.qmodel_7_onyx.qa.benchmark:main"
qmodel-replay = "src.systems.qmodel_7_onyx.live.replay:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
# assets_paths.json ships alongside the code (paths.ASSETS_PATHS_JSON is
# package-relative) but setuptools doesn't bundle non-.py files by default.
"src.systems.qmodel_7_onyx" = ["assets_paths.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W  = pycodestyle, F = pyflakes, I = import sorting, B = bugbear (real
# bug patterns). Deliberately NOT enabling UP (pyupgrade): this codebase
# consistently uses typing.Optional/List/Dict rather than the PEP 604/585
# `X | None` / `list[X]` syntax, and adopting the latter is a separate style
# decision, not something to churn as a lint side-effect.
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# CLI scripts intentionally re-import a name inside main() to keep a heavy
# dependency (e.g. ultralytics) import deferred; that pattern trips F401 on
# the outer scope in a few places. Nothing currently needs a blanket
# per-file ignore here — kept as a documented extension point.
